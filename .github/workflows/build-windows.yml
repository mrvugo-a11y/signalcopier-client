name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]          # pushing a tag like v1.1.0 also publishes a GitHub Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Fill in built in credentials from secrets (optional)
        shell: python
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LICENCE_URL: ${{ secrets.LICENCE_URL }}
        run: |
          import os, re
          p = "copier/app_credentials.py"; s = open(p, encoding="utf-8").read()
          for env, var, q in (("TG_API_ID", "TELEGRAM_API_ID", False), ("TG_API_HASH", "TELEGRAM_API_HASH", True), ("LICENCE_URL", "LICENCE_URL", True)):
              v = os.environ.get(env, "").strip()
              if v:
                  s = re.sub(rf"^{var} = .*$", f"{var} = {v!r}" if q else f"{var} = {int(v)}", s, flags=re.M)
                  print("set", var)
          open(p, "w", encoding="utf-8").write(s)

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build exe with PyInstaller
        run: python -m PyInstaller --noconfirm SignalPilot.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.2.0" }
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          & $iscc.FullName "/DAppVersion=$ver" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "Output\SignalPilot Setup.exe" "Output\SignalPilot-Setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: SignalPilot-Setup
          path: Output/SignalPilot Setup.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/SignalPilot Setup.exe
            Output/SignalPilot-Setup.exe
